<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection - Supreme Watches</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container navbar">
            <a href="index.html" class="logo">SUPREME</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="collection.html" class="active">Collection</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </header>

    <main>
        <div class="container collection-page">
            <!-- Filters Sidebar -->
            <aside class="filters-sidebar">
                <div class="filter-group">
                    <h3>Categories</h3>
                    <ul id="category-filter">
                        <!-- Categories will be loaded by JavaScript -->
                    </ul>
                </div>
                <div class="filter-group">
                    <h3>Price</h3>
                    <label for="price-range">Max Price: $<span id="price-value">5000</span></label>
                    <input type="range" id="price-range" min="0" max="5000" step="100" value="5000">
                </div>
                <button id="reset-filters" class="btn">Reset Filters</button>
            </aside>

            <!-- Watches Main Area -->
            <section class="watches-main">
                <div class="collection-header">
                    <h2>Our Collection</h2>
                    <p id="product-count">Showing 0 products</p>
                </div>
                <div class="product-grid" id="all-watches-grid">
                    <!-- All watches will be loaded here -->
                </div>
                <div class="pagination" id="pagination">
                    <!-- Pagination buttons will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Supreme Watches. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
