<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme Watches - Timeless Elegance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="container navbar">
            <a href="index.html" class="logo">SUPREME</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="collection.html">Collection</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
        </div>
    </header>

    <main>
        <!-- Hero Banner Slider -->
        <section class="hero-slider" id="hero-slider">
            <!-- Slides will be loaded by JavaScript -->
            <div class="slider-nav">
                <button class="slider-btn" id="prev-slide">&lt;</button>
                <button class="slider-btn" id="next-slide">&gt;</button>
            </div>
        </section>

        <!-- Featured Watches Section -->
        <section class="featured-section">
            <div class="container">
                <h2 class="section-title">Featured Timepieces</h2>
                <div class="product-grid" id="featured-watches-grid">
                    <!-- Featured watches will be loaded by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Supreme Watches. All Rights Reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
