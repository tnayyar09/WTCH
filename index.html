<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Watch Shop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Our Exquisite Watch Collection</h1>

    <div id="product-container">
        <p>Loading watches from Supabase...</p>
    </div>

    <a href="admin.html" class="nav-link">Go to Admin Panel</a>

    <!-- 
      CORRECT ORDER:
      STEP 1: Load the main Supabase library first. This creates the global `supabase` object.
    -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 
      STEP 2: Now, load our custom module. It can now safely use the `supabase` object.
    -->
    <script type="module">
        // Import our custom-initialized client
        import { client as supabase } from './js/supabase-client.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('product-container');

            try {
                // Fetch products from the 'products' table
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                if (products.length === 0) {
                    container.innerHTML = '<p>No watches found. Please add some from the admin panel.</p>';
                    return;
                }

                container.innerHTML = '';
                
                products.forEach(product => {
                    const price = (typeof product.price === 'number') ? product.price : 0;
                    
                    const productCardHTML = `
                        <div class="product-card">
                            <img src="${product.image_url}" alt="${product.name}">
                            <h3>${product.name}</h3>
                            <p class="price">$${price.toFixed(2)}</p>
                        </div>
                    `;
                    container.innerHTML += productCardHTML;
                });

            } catch (error) {
                console.error('Error fetching products:', error);
                container.innerHTML = `<p style="color: red;">Error loading products: ${error.message}</p>`;
            }
        });
    </script>

</body>
</html>
