<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <h1>Admin Dashboard</h1>
        <a href="../index.html" target="_blank">View Live Site</a>
    </header>

    <div class="admin-container">
        <nav class="admin-nav">
            <a href="dashboard.html" class="active">Manage Watches</a>
            <a href="manage-banners.html">Manage Banners</a>
        </nav>

        <div class="admin-card">
            <h2>Add New Watch</h2>
            <form id="add-watch-form" class="admin-form">
                <!-- Form fields go here (name, price, desc, category, image, is_featured checkbox) -->
            </form>
        </div>

        <div class="admin-card">
            <h2>Current Watch Collection</h2>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Featured</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="watches-table-body">
                        <!-- Watch rows will be loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Admin-specific JS file (e.g., admin.js) -->
    <!-- <script type="module" src="admin.js"></script> -->
</body>
</html>
