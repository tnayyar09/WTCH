<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Product</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-container">
        <h1>Add a New Product</h1>
        <p id="message"></p>

        <form id="add-product-form">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" step="0.01" id="price" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" required placeholder="e.g., Luxury, Sports, Classic">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="3" required></textarea>
            </div>
            <div class="form-group">
                <label for="is_featured">Featured Watch?</label>
                <select id="is_featured">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>
            <div class="form-group">
                <label for="image">Product Image</label>
                <input type="file" id="image" accept="image/png, image/jpeg" required>
            </div>
            <button type="submit" id="submit-btn">Add Product</button>
        </form>

        <a href="index.html" class="nav-link">Back to Shop</a>
    </div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Page Specific Script -->
    <script type="module">
        // FIXED: 'client' ko 'supabase' se replace kar diya hai
        import { supabase } from './js/supabase-client.js';

        document.getElementById('add-product-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const form = event.target;
            const name = form.name.value;
            const price = parseFloat(form.price.value);
            const category = form.category.value;
            const description = form.description.value;
            const isFeatured = form.is_featured.value === 'true';
            const imageFile = form.image.files[0];
            
            const messageEl = document.getElementById('message');
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            messageEl.textContent = '';
            messageEl.className = '';

            try {
                if (!imageFile) throw new Error("Please select an image file.");
                if (!name || !price || !category) throw new Error("Name, Price, and Category are required.");

                // 1. Upload image to Supabase Storage
                const imageName = `${Date.now()}-${imageFile.name}`;
                const { error: imageError } = await supabase.storage
                    .from('product-images')
                    .upload(imageName, imageFile);

                if (imageError) throw imageError;

                // 2. Get the public URL of the uploaded image
                const { data: { publicUrl } } = supabase.storage
                    .from('product-images')
                    .getPublicUrl(imageName);

                // 3. Insert product data into the database
                const { error: dbError } = await supabase
                    .from('watches')
                    .insert([{ 
                        name, 
                        price, 
                        category, 
                        description, 
                        is_featured: isFeatured, 
                        image_url: publicUrl 
                    }]);

                if (dbError) throw dbError;
                
                // Success!
                messageEl.textContent = 'Product added successfully!';
                messageEl.classList.add('success');
                form.reset();

            } catch (error) {
                console.error('Error adding product:', error);
                messageEl.textContent = `Error: ${error.message}`;
                messageEl.classList.add('error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Add Product';
            }
        });
    </script>
</body>
</html>
